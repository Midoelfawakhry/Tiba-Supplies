name: Build Tiba Supplies Android APKs

on:
  workflow_dispatch:
    inputs:
      app_mode:
        description: Which Android app to build
        required: true
        type: choice
        options:
          - driver
          - office
          - both
        default: both
  push:
    branches:
      - phase2-driver-app-foundation
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/driver-android-apk.yml'

permissions:
  contents: read

jobs:
  select-builds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.app_mode }}"
          else
            MODE="both"
          fi
          if [ "$MODE" = "both" ]; then
            echo 'matrix={"app_mode":["driver","office"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"app_mode\":[\"$MODE\"]}" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    needs: select-builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select-builds.outputs.matrix) }}
    env:
      VITE_APP_MODE: ${{ matrix.app_mode }}
      TIBA_APP_MODE: ${{ matrix.app_mode }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Supabase build configuration
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret: VITE_SUPABASE_URL (or SUPABASE_URL)"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: VITE_SUPABASE_PUBLISHABLE_KEY (or SUPABASE_PUBLISHABLE_KEY / SUPABASE_ANON_KEY)"
            exit 1
          fi
          echo "Supabase URL and publishable key are configured."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build app bundle
        run: npm run build

      - name: Generate Capacitor config
        run: |
          node -e 'const mode=process.env.TIBA_APP_MODE; const office=mode === "office"; const config={appId:office ? "com.tibasupplies.office" : "com.tibasupplies.driver",appName:office ? "Tiba Supplies Office" : "Tiba Supplies Driver",webDir:"dist",android:{allowMixedContent:false}}; require("fs").writeFileSync("capacitor.config.json", JSON.stringify(config,null,2)+"\\n")'

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android platform
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-supplies-${{ matrix.app_mode }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
