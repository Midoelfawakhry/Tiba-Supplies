name: Build Tiba Supplies Android APKs

on:
  workflow_dispatch:
    inputs:
      app_mode:
        description: Which Android app to build
        required: true
        type: choice
        options:
          - driver
          - office
          - both
        default: office
  push:
    branches:
      - phase2-driver-app-foundation
    paths:
      - 'src/**'
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/driver-android-apk.yml'

permissions:
  contents: read

jobs:
  select-builds:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.app_mode }}"
          else
            MODE="driver"
          fi
          if [ "$MODE" = "both" ]; then
            echo 'matrix={"app_mode":["driver","office"]}' >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"app_mode\":[\"$MODE\"]}" >> "$GITHUB_OUTPUT"
          fi

  build-apk:
    needs: select-builds
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app_mode: ${{ fromJson(needs.select-builds.outputs.matrix).app_mode }}
    env:
      VITE_APP_MODE: ${{ matrix.app_mode }}
      TIBA_APP_MODE: ${{ matrix.app_mode }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify and normalize Supabase configuration
        shell: bash
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret: VITE_SUPABASE_URL (or SUPABASE_URL)"
            exit 1
          fi
          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret: VITE_SUPABASE_PUBLISHABLE_KEY (or SUPABASE_PUBLISHABLE_KEY / SUPABASE_ANON_KEY)"
            exit 1
          fi

          # Supabase createClient expects the project URL, not the REST endpoint path.
          NORMALIZED_URL="$(node -e 'const u = new URL(process.env.VITE_SUPABASE_URL); if (u.protocol !== "https:" || !u.hostname.endsWith(".supabase.co")) process.exit(2); process.stdout.write(u.origin)')" || {
            echo "::error::VITE_SUPABASE_URL is not a valid HTTPS Supabase project URL."
            exit 1
          }
          echo "VITE_SUPABASE_URL=$NORMALIZED_URL" >> "$GITHUB_ENV"
          echo "Supabase project URL is configured and normalized to the project origin."
          echo "Publishable key is present (value intentionally not logged)."

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run lint

      - name: Build app bundle
        run: npm run build

      - name: Verify Supabase configuration is embedded in app bundle
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = 'dist';
          const expectedUrl = process.env.VITE_SUPABASE_URL;
          const expectedKey = process.env.VITE_SUPABASE_PUBLISHABLE_KEY;
          const files = fs.readdirSync(path.join(root, 'assets'))
            .filter(name => name.endsWith('.js'))
            .map(name => fs.readFileSync(path.join(root, 'assets', name), 'utf8'));
          const bundle = files.join('\n');
          if (!files.length) throw new Error('No JavaScript bundles found in dist/assets.');
          if (!bundle.includes(expectedUrl)) throw new Error('Built bundle does not contain the normalized Supabase project URL.');
          if (!bundle.includes(expectedKey)) throw new Error('Built bundle does not contain the configured public Supabase key.');
          console.log('Verified: normalized Supabase URL and configured public key are embedded in the built bundle. Key value not logged.');
          NODE

      - name: Generate Capacitor config
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const mode = process.env.TIBA_APP_MODE;
          const office = mode === 'office';
          const config = {
            appId: office ? 'com.tibasupplies.office' : 'com.tibasupplies.driver',
            appName: office ? 'Tiba Supplies Office' : 'Tiba Supplies Driver',
            webDir: 'dist',
            android: { allowMixedContent: false }
          };
          fs.writeFileSync('capacitor.config.json', JSON.stringify(config, null, 2) + String.fromCharCode(10));
          console.log('Generated Capacitor config for ' + mode);
          console.log(fs.readFileSync('capacitor.config.json', 'utf8'));
          NODE

      - name: Validate Capacitor config
        run: node -e "const c=require('./capacitor.config.json'); if(!c.appId || !c.appName || !c.webDir) process.exit(1); console.log('Capacitor config valid:', c.appId)"

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Android platform
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tiba-supplies-${{ matrix.app_mode }}-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
