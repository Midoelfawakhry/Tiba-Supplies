name: Deploy Tiba AI assistant Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/tiba-ai-assistant/**"
      - ".github/workflows/deploy-tiba-ai-assistant.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy tiba-ai-assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy AI assistant
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing repository secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          supabase functions deploy tiba-ai-assistant --project-ref "tnlcvwtphbunteifoonc"
