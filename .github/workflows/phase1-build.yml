name: Phase 1 build

on:
  push:
    branches: [main, phase1-core-workflow, phase1-direct-assignment-acceptance]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run build
