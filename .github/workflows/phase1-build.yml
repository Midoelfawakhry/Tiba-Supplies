name: Phase 1 build

on:
  push:
    branches: [main, phase1-core-workflow, phase1-direct-assignment-acceptance, shadow/phase1-hardening]
  pull_request:
    branches: [main, shadow/phase1-hardening]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run lint
      - run: npm run test:phase1
      - run: npm run build

  sql-regex-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tibasupplies_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tibasupplies_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Run regex detector smoke test
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d tibasupplies_test -f supabase/tests/phase1_regex_smoke.sql
      - name: Run client table privilege migration regression test
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d tibasupplies_test -f supabase/tests/phase1_client_table_privilege_checks.sql
      - name: Test master directory migration on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d tibasupplies_test -f supabase/tests/master_directory_write_migration_test.sql
      - name: Test driver vehicle picker authorization on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d tibasupplies_test -f supabase/tests/available_driver_vehicles_security_test.sql
      - name: Test internal counter RLS on disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d tibasupplies_test -f supabase/tests/internal_counter_rls_test.sql
      - name: Test trigger-only driver office assignment privileges and behavior
        env:
          PGPASSWORD: postgres
        run: psql -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d tibasupplies_test -f supabase/tests/auto_assign_driver_trigger_privileges_test.sql
