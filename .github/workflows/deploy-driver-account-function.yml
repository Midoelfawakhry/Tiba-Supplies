name: Deploy driver account Edge Function

on:
  push:
    branches:
      - main
    paths:
      - "supabase/functions/create-driver-account/**"
      - ".github/workflows/deploy-driver-account-function.yml"

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy create-driver-account
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy create-driver-account
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing repository secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          supabase functions deploy create-driver-account --project-ref "tnlcvwtphbunteifoonc"
