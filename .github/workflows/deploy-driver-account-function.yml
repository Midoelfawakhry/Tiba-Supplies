name: Deploy driver account Edge Function

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy create-driver-account
    runs-on: ubuntu-latest
    environment: supabase-production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing repository secret: SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing repository secret: SUPABASE_PROJECT_REF" && exit 1)
          supabase functions deploy create-driver-account --project-ref "$SUPABASE_PROJECT_REF"
